<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeltrainer: Russisch</title>
    <style>
        :root {
            --primary-green: #27ae60;
            --dark-green: #1e8449;
            --light-green: #eafaf1;
            --bg-color: #f1f8f4;
            --text-color: #2c3e50;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: var(--dark-green);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .progress {
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary-green);
            font-size: 1.1rem;
        }

        /* Flashcard 3D Effekt */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 300px;
            margin: 0 auto 30px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: var(--card-shadow);
            border-radius: 20px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
            border-radius: 20px;
            background: white;
            border: 2px solid var(--primary-green);
        }

        .card-front {
            color: var(--dark-green);
        }

        .card-back {
            background-color: var(--light-green);
            transform: rotateY(180deg);
            color: var(--text-color);
        }

        /* Dynamische Schriftgröße */
        .card-text {
            font-size: 1.8rem;
            font-weight: bold;
            word-wrap: break-word;
            max-width: 100%;
            text-align: center;
        }

        .card-note {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #7f8c8d;
            font-style: italic;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .main-nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary-green);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--dark-green);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background-color: #95a5a6;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .hint {
            font-size: 0.85rem;
            color: #95a5a6;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .card-text { font-size: 1.4rem; }
            .flashcard-container { height: 250px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Russisch-Vokabeltrainer</h1>
    <div class="progress" id="progress">1 / 30</div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="card">
            <div class="card-face card-front">
                <div class="card-text" id="front-text">Vorderseite</div>
                <div class="card-note" id="front-note"></div>
            </div>
            <div class="card-face card-back">
                <div class="card-text" id="back-text">Rückseite</div>
                <div class="card-note" id="back-note"></div>
            </div>
        </div>
    </div>

    <div class="main-nav">
        <button id="prevBtn" onclick="prevCard()">← Vorherige</button>
        <button id="nextBtn" onclick="nextCard()">Nächste →</button>
    </div>

    <div class="controls">
        <button class="btn-secondary" onclick="resetToStart()">An den Anfang</button>
        <button class="btn-secondary" onclick="shuffleCards()">🔀 Mischen</button>
    </div>

    <div class="hint">
        Tipp: Leertaste/Enter zum Umdrehen | Pfeiltasten zur Navigation
    </div>
</div>

<script>
    // Die Vokabelliste
    const rawData = [
        ["беси́ть / взбеси́ть", "wahnsinnig machen, extrem nerven", "", "Verb-Paar (NSV/SV)"],
        ["беси́ться / взбеси́ться", "wüten, außer sich sein vor Zorn", "", "Verb-Paar (NSV/SV)"],
        ["бес", "der Dämon, der Teufel", "", ""],
        ["бе́шенство", "die Tollwut, die Raserei", "", ""],
        ["раздража́ть / раздражи́ть", "reizen, irritieren", "", "Verb-Paar (NSV/SV)"],
        ["злой", "böse, wütend", "", ""],
        ["злость", "der Zorn, die Wut", "", ""],
        ["не́рвничать", "nervös sein, sich aufregen", "", "NSV"],
        ["про́бка", "der Stau (auch: der Korken)", "", ""],
        ["дождь", "der Regen", "", ""],
        ["снег", "der Schnee", "", ""],
        ["стро́йка", "die Baustelle", "", ""],
        ["метро́", "die U-Bahn", "", ""],
        ["сосе́д", "der Nachbar", "", ""],
        ["челове́к", "der Mensch", "", ""],
        ["лю́ди", "die Leute, die Menschen", "", "Plural"],
        ["доро́га", "der Weg, die Straße", "", ""],
        ["ложь", "die Lüge", "", ""],
        ["громкий", "laut", "", ""],
        ["у́жасно", "schrecklich, furchtbar", "", "Adverb"],
        ["ве́чный", "ewig", "", ""],
        ["центр", "das Zentrum", "", ""],
        ["райо́н", "das Viertel, der Bezirk", "", ""],
        ["кома́р", "die Mücke", "", ""],
        ["му́зыка", "die Musik", "", ""],
        ["настрое́ние", "die Stimmung, die Laune", "", ""],
        ["согла́сен / согла́сна", "einverstanden (m/f)", "", ""],
        ["понима́ть / поня́ть", "verstehen", "", "Verb-Paar (NSV/SV)"],
        ["нра́виться / понра́виться", "gefallen", "", "Verb-Paar (NSV/SV)"],
        ["шуме́ть / пошуме́ть", "lärmen, Krach machen", "", "Verb-Paar (NSV/SV)"]
    ];

    let cards = [...rawData];
    let currentIndex = 0;

    const cardElement = document.getElementById('card');
    const frontText = document.getElementById('front-text');
    const backText = document.getElementById('back-text');
    const frontNote = document.getElementById('front-note');
    const backNote = document.getElementById('back-note');
    const progressElement = document.getElementById('progress');

    // Karte aktualisieren
    function updateCard() {
        // Karte zurückdrehen (Frontansicht) vor dem Wechsel
        cardElement.classList.remove('is-flipped');
        
        setTimeout(() => {
            const currentCard = cards[currentIndex];
            frontText.innerText = currentCard[0];
            backText.innerText = currentCard[1];
            frontNote.innerText = currentCard[2] || "";
            backNote.innerText = currentCard[3] || "";
            
            progressElement.innerText = `${currentIndex + 1} / ${cards.length}`;
            
            // Schriftgröße anpassen
            adjustFontSize(frontText);
            adjustFontSize(backText);
        }, 150);
    }

    function adjustFontSize(element) {
        const length = element.innerText.length;
        if (length > 40) element.style.fontSize = "1.2rem";
        else if (length > 20) element.style.fontSize = "1.5rem";
        else element.style.fontSize = "1.8rem";
    }

    // Funktionen
    function flipCard() {
        cardElement.classList.toggle('is-flipped');
    }

    function nextCard() {
        if (currentIndex < cards.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    function resetToStart() {
        currentIndex = 0;
        updateCard();
    }

    function shuffleCards() {
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        resetToStart();
    }

    // Tastatursteuerung
    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case ' ':
            case 'Enter':
                e.preventDefault();
                flipCard();
                break;
            case 'ArrowRight':
                nextCard();
                break;
            case 'ArrowLeft':
                prevCard();
                break;
            case 'Home':
                e.preventDefault();
                resetToStart();
                break;
        }
    });

    // Initialisierung
    updateCard();
</script>

</body>
</html>
